# Hypixel Bed Wars proxy settings
# Local port you add to Minecraft as a server (localhost:25565).
listen.port=25565
# Server the proxy connects to.
upstream.host=mc.hypixel.net
# Upstream port.
upstream.port=25565
# Where timers/upgrades show: sidebar, tablist, actionbar (comma separate to combine), off.
hud.output=sidebar
# How often the HUD refreshes.
hud.refresh_ms=1000
# Prefix for chat messages from the proxy.
alerts.prefix=§8§l» §r
# Master switch for alert pings: with this off, armor/item/upgrade alerts
# still post to chat but make no sound.
alerts.sound=true
# Armor Alerts: call out enemy armor upgrades.
armor.enabled=true
# None | Diamond Only | All
armor.ping=All
# Alert on chainmail.
armor.chainmail=true
# Alert on iron.
armor.iron=true
# Alert on diamond.
armor.diamond=true
# Item Alerts: warn when enemies reveal important items.
items.enabled=true
# None | Important | All
items.ping=All
items.iron_sword=true
items.diamond_sword=true
items.fireball=true
items.knockback_stick=true
items.bow=true
items.tnt=true
items.obsidian=true
items.pearl=true
items.bridge_egg=true
# Invisibility, jump, speed, milk.
items.potions=true
items.golden_apple=true
items.water_bucket=true
items.gold_pickaxe=true
items.diamond_pickaxe=true
items.dream_defender=true
items.bedbug=true
items.popup_tower=true
# Rotating Dream/Lucky Block items.
items.rotation=true
# Quick Shop: left click in the item shop is sent as a middle click (one click, no automation).
quickshop.enabled=true
# Timers HUD: emerald/diamond spawn timers.
timers.enabled=true
# Also show elapsed game time.
timers.show_game_time=false
# Upgrade Alerts: enemy sharpness/protection upgrades.
upgradealerts.enabled=true
# Play a ping.
upgradealerts.ping=true
# Upgrades HUD: your team's traps/sharpness/protection.
upgradeshud.enabled=false
upgradeshud.traps=true
upgradeshud.sharp=true
upgradeshud.prot=true
